<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pressure Ulcer Risk Calculator</title>

<style>
    body{
        font-family: Arial, sans-serif;
        background:#eef5ff;
        margin:0;
        padding:20px;
    }

    .container{
        max-width:900px;
        margin:auto;
        background:white;
        padding:25px;
        border-radius:20px;
        box-shadow:0 0 15px rgba(0,0,0,0.1);
    }

    h1{
        text-align:center;
        color:#1e4fa3;
    }

    .box{
        margin-top:20px;
        padding:15px;
        background:#f4f8ff;
        border-radius:15px;
    }

    label{
        font-weight:bold;
    }

    input, button, textarea{
        width:100%;
        padding:10px;
        margin-top:8px;
        margin-bottom:15px;
        border-radius:10px;
        border:1px solid #ccc;
        font-size:16px;
    }

    button{
        background:#1e4fa3;
        color:white;
        cursor:pointer;
        border:none;
    }

    button:hover{
        background:#163b7a;
    }

    .result{
        font-size:20px;
        font-weight:bold;
        color:#d62828;
    }

    .safe{
        color:green;
    }

    .warning{
        color:orange;
    }

    .danger{
        color:red;
    }

    table{
        width:100%;
        border-collapse:collapse;
        margin-top:15px;
    }

    table, th, td{
        border:1px solid #ccc;
    }

    th, td{
        padding:10px;
        text-align:center;
    }

    .feedback-box{
        margin-top:20px;
    }

</style>
</head>

<body>

<div class="container">

<h1>Pressure Ulcer Risk Calculator<br>
(ระบบประเมินความเสี่ยงแผลกดทับ)</h1>

<div class="box">

<label>ชื่อผู้ใช้งาน</label>
<input type="text" id="username" placeholder="กรอกชื่อ">

<label>น้ำหนักตัว (กิโลกรัม)</label>
<input type="number" id="weight" placeholder="เช่น 50">

<label>มุมเตียงที่ใช้นอน (องศา)</label>
<input type="number" id="angle" placeholder="0 - 90">

<button onclick="calculateRisk()">คำนวณความเสี่ยง</button>

</div>

<div class="box">

<h2>ผลการประเมิน</h2>

<p id="riskResult" class="result"></p>

<p id="advice"></p>

<p id="problem"></p>

<p id="model"></p>

</div>

<div class="box">

<h2>ประวัติการใช้งาน</h2>

<table>
<thead>
<tr>
<th>ชื่อ</th>
<th>น้ำหนัก</th>
<th>มุม</th>
<th>ค่าความเสี่ยง</th>
</tr>
</thead>

<tbody id="historyTable"></tbody>

</table>

</div>

<div class="box feedback-box">

<h2>Feedback (ความคิดเห็นหลังใช้งาน)</h2>

<textarea id="feedbackText" rows="4" placeholder="แสดงความคิดเห็น..."></textarea>

<button onclick="saveFeedback()">ส่งความคิดเห็น</button>

<ul id="feedbackList"></ul>

</div>

</div>

<script>

function calculateRisk(){

    let username = document.getElementById("username").value;
    let weight = parseFloat(document.getElementById("weight").value);
    let angle = parseFloat(document.getElementById("angle").value);

    if(isNaN(weight) || isNaN(angle)){
        alert("กรุณากรอกข้อมูลให้ครบ");
        return;
    }

    // แปลงองศาเป็นเรเดียน
    let rad = angle * Math.PI / 180;

    // แรงกด
    let Fn = weight * 9.81 * Math.cos(rad);

    // แรงเฉือน
    let Fs = weight * 9.81 * Math.sin(rad);

    // Normalize
    let FnPrime = Fn / (weight * 9.81);
    let FsPrime = Fs / (weight * 9.81);

    // Risk Equation
    let risk = 0.5 * (FnPrime + FsPrime);

    risk = risk.toFixed(3);

    let level = "";
    let advice = "";
    let problem = "";
    let model = "";

    if(risk < 0.60){

        level = "ความเสี่ยงต่ำ";
        advice = "แนะนำให้นอนในช่วงมุม 0° - 15° และเปลี่ยนท่านอนทุก 2 ชั่วโมง";
        problem = "หากนอนท่าเดิมนานเกินไป อาจเริ่มเกิดการกดทับบริเวณผิวหนัง";
        model = "แบบจำลองท่า : นอนราบหรือนอนเอียงเล็กน้อย";

        document.getElementById("riskResult").className = "result safe";

    }else if(risk < 0.70){

        level = "ความเสี่ยงปานกลาง";
        advice = "ควรลดมุมเตียงลง และใช้หมอนรองเพื่อลดแรงกด";
        problem = "อาจเกิดผิวหนังแดง ระคายเคือง หรือเริ่มมีแผลกดทับระยะต้น";
        model = "แบบจำลองท่า : นอนยกหัวเตียงประมาณ 30°";

        document.getElementById("riskResult").className = "result warning";

    }else{

        level = "ความเสี่ยงสูง";
        advice = "ควรลดมุมเตียงลงต่ำกว่า 45° และพลิกตัวบ่อยขึ้น";
        problem = "เสี่ยงเกิดแผลกดทับรุนแรง การไหลเวียนเลือดลดลง และเกิดการบาดเจ็บของเนื้อเยื่อ";
        model = "แบบจำลองท่า : นอนยกหัวเตียงสูงมาก";

        document.getElementById("riskResult").className = "result danger";
    }

    document.getElementById("riskResult").innerHTML =
        "ค่าความเสี่ยง = " + risk + " (" + level + ")";

    document.getElementById("advice").innerHTML =
        "<b>คำแนะนำ :</b> " + advice;

    document.getElementById("problem").innerHTML =
        "<b>ผลกระทบหากยังนอนมุมเดิม :</b> " + problem;

    document.getElementById("model").innerHTML =
        "<b>" + model + "</b>";

    // บันทึกข้อมูล
    let data = {
        username: username,
        weight: weight,
        angle: angle,
        risk: risk
    };

    let history = JSON.parse(localStorage.getItem("history")) || [];

    history.push(data);

    localStorage.setItem("history", JSON.stringify(history));

    showHistory();
}

function showHistory(){

    let history = JSON.parse(localStorage.getItem("history")) || [];

    let table = document.getElementById("historyTable");

    table.innerHTML = "";

    history.forEach(item => {

        table.innerHTML += `
        <tr>
            <td>${item.username}</td>
            <td>${item.weight}</td>
            <td>${item.angle}°</td>
            <td>${item.risk}</td>
        </tr>
        `;
    });
}

function saveFeedback(){

    let text = document.getElementById("feedbackText").value;

    if(text === ""){
        return;
    }

    let feedbacks = JSON.parse(localStorage.getItem("feedbacks")) || [];

    feedbacks.push(text);

    localStorage.setItem("feedbacks", JSON.stringify(feedbacks));

    document.getElementById("feedbackText").value = "";

    showFeedback();
}

function showFeedback(){

    let feedbacks = JSON.parse(localStorage.getItem("feedbacks")) || [];

    let list = document.getElementById("feedbackList");

    list.innerHTML = "";

    feedbacks.forEach(item => {

        list.innerHTML += `<li>${item}</li>`;

    });
}

showHistory();
showFeedback();

</script>

</body>
</html>
